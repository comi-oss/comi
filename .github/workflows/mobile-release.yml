name: Mobile release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate merged-PR version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              base: "main",
              per_page: 100,
            });
            const merged = prs
              .filter((pr) => pr.merged_at)
              .sort((a, b) => Date.parse(a.merged_at) - Date.parse(b.merged_at) || a.number - b.number);
            const index = merged.findIndex((pr) => pr.number === context.payload.pull_request.number);
            if (index < 0) throw new Error("Could not find the merged pull request in GitHub's PR list.");
            core.setOutput("version", `v0.0.${index + 1}`);

  android:
    if: github.event.pull_request.merged == true
    needs: [version]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set Android NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci --skip-targets-install
      - run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COMI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          input=src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk
          aligned="$RUNNER_TEMP/comi-arm64-aligned.apk"
          keystore="$RUNNER_TEMP/comi-preview.keystore"
          output="$RUNNER_TEMP/Comi-${VERSION}.apk"
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$input" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias preview \
            --ks-pass pass:android --key-pass pass:android \
            --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$output"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: ${{ runner.temp }}/Comi-${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  ios:
    if: github.event.pull_request.merged == true
    needs: [version]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      IOS_SIGNING_CONFIGURED: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_MOBILE_PROVISION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri ios init --ci
      - name: Build iOS IPA with Personal Team signing
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        run: pnpm tauri ios build --ci --export-method debugging

      - name: Build unsigned iOS IPA
        if: env.IOS_SIGNING_CONFIGURED != 'true'
        run: pnpm tauri ios build --ci --no-sign

      - name: Name iOS IPA
        run: |
          set -euo pipefail
          ipa="$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          if [[ "$IOS_SIGNING_CONFIGURED" == "true" ]]; then
            cp "$ipa" "$RUNNER_TEMP/Comi-${VERSION}-ios-personal-team.ipa"
          else
            cp "$ipa" "$RUNNER_TEMP/Comi-${VERSION}-ios-unsigned.ipa"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: ${{ runner.temp }}/Comi-${{ needs.version.outputs.version }}-ios-*.ipa
          if-no-files-found: error

  release:
    if: github.event.pull_request.merged == true
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: Comi ${{ needs.version.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
