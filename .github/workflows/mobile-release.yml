name: Mobile release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Calculate merged-PR version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "closed",
              base: "main",
              per_page: 100,
            });
            const merged = prs
              .filter((pr) => pr.merged_at)
              .sort((a, b) => Date.parse(a.merged_at) - Date.parse(b.merged_at) || a.number - b.number);
            const index = merged.findIndex((pr) => pr.number === context.payload.pull_request.number);
            if (index < 0) throw new Error("Could not find the merged pull request in GitHub's PR list.");
            core.setOutput("version", `v0.0.${index + 1}`);

  android:
    if: github.event.pull_request.merged == true
    needs: [version]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Set Android NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci --skip-targets-install
      - run: pnpm tauri android build --apk --split-per-abi --target aarch64

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.COMI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          input=src/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk
          aligned="$RUNNER_TEMP/comi-arm64-aligned.apk"
          keystore="$RUNNER_TEMP/comi-preview.keystore"
          output="$RUNNER_TEMP/Comi-${VERSION}-Android.apk"
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$input" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias preview \
            --ks-pass pass:android --key-pass pass:android \
            --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$output"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: ${{ runner.temp }}/Comi-${{ needs.version.outputs.version }}-Android.apk
          if-no-files-found: error

  ios:
    if: github.event.pull_request.merged == true
    needs: [version]
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IOS_SIGNING_CONFIGURED: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_MOBILE_PROVISION != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri ios init --ci
      - name: Validate free Personal Team signing files
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/comi-ios-development.p12"
          profile="$RUNNER_TEMP/comi-ios-development.mobileprovision"
          profile_plist="$RUNNER_TEMP/comi-ios-development.plist"
          private_key="$RUNNER_TEMP/comi-ios-development.key.pem"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$cert"
          printf '%s' "$IOS_MOBILE_PROVISION" | base64 --decode > "$profile"

          # Fail here with an actionable message if the secret is not a usable
          # PKCS#12 export or its password does not match. Tauri's later import
          # otherwise fails with a low-level Security.framework error.
          if ! openssl pkcs12 -in "$cert" -passin env:IOS_CERTIFICATE_PASSWORD -clcerts -nokeys -out "$RUNNER_TEMP/comi-ios-cert.pem" 2>"$RUNNER_TEMP/comi-ios-cert-error"; then
            echo "IOS_CERTIFICATE could not be opened. Re-export the Apple Development certificate and private key from Keychain Access as a password-protected .p12, then update IOS_CERTIFICATE and IOS_CERTIFICATE_PASSWORD together."
            exit 1
          fi
          if ! openssl pkcs12 -in "$cert" -passin env:IOS_CERTIFICATE_PASSWORD -nocerts -nodes -out "$private_key" 2>/dev/null || ! grep -q 'PRIVATE KEY' "$private_key"; then
            echo "IOS_CERTIFICATE opened, but it does not contain the private signing key. Export the certificate together with its private key from Keychain Access."
            exit 1
          fi
          rm -f "$private_key"

          if ! security cms -D -i "$profile" > "$profile_plist" 2>/dev/null; then
            echo "IOS_MOBILE_PROVISION is not a valid base64-encoded .mobileprovision profile."
            exit 1
          fi
          python3 - "$profile_plist" <<'PY'
          import datetime
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as profile_file:
              profile = plistlib.load(profile_file)
          expiration = profile["ExpirationDate"]
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          expiration = expiration.astimezone(datetime.timezone.utc)
          if expiration <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit(f"Personal Team provisioning profile expired at {expiration.isoformat()}; export a fresh profile from Xcode.")
          app_id = profile.get("Entitlements", {}).get("application-identifier", "")
          if app_id.split(".", 1)[-1] != "id.mikira.cf.viewer":
              raise SystemExit(f"Provisioning profile targets {app_id!r}, expected the id.mikira.cf.viewer app identifier.")
          if not profile.get("ProvisionedDevices"):
              raise SystemExit("Provisioning profile has no registered devices. Add the test iPhone in Xcode and export its development profile again.")
          print(f"Valid Personal Team profile for {app_id}; expires {expiration.isoformat()}.")
          PY
      - name: Build iOS IPA with Personal Team signing
        if: env.IOS_SIGNING_CONFIGURED == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: pnpm tauri ios build --ci --export-method debugging

      - name: Build unsigned iOS IPA
        if: env.IOS_SIGNING_CONFIGURED != 'true'
        run: pnpm tauri ios build --ci --no-sign

      - name: Name iOS IPA
        run: |
          set -euo pipefail
          ipa="$(find src/gen/apple/build -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          if [[ "$IOS_SIGNING_CONFIGURED" == "true" ]]; then
            app_dir="$RUNNER_TEMP/comi-ios-ipa-check"
            mkdir -p "$app_dir"
            ditto -x -k "$ipa" "$app_dir"
            app_path="$(find "$app_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
            test -n "$app_path"
            codesign --verify --deep --strict "$app_path"
            test -f "$app_path/embedded.mobileprovision"
            cp "$ipa" "$RUNNER_TEMP/Comi-${VERSION}-IOS-development.ipa"
          else
            cp "$ipa" "$RUNNER_TEMP/Comi-${VERSION}-IOS-unsigned.ipa"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_SIGNING_CONFIGURED == 'true' && 'ios-development' || 'ios-unsigned' }}
          path: ${{ runner.temp }}/Comi-${{ needs.version.outputs.version }}-IOS-*.ipa
          if-no-files-found: error

  release:
    if: >-
      always() &&
      github.event.pull_request.merged == true &&
      needs.version.result == 'success' &&
      (needs.android.result == 'success' || needs.ios.result == 'success')
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: Comi ${{ needs.version.outputs.version }}
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
