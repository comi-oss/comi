name = "comi-catalog-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-04"
workers_dev = true

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "comi"
database_id = "9a85f3f9-50cb-49fb-9051-c0abd46d9485"

[[r2_buckets]]
binding = "CATALOG_RELEASES"
bucket_name = "comi-catalog-releases"
