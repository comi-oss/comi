[package]
name = "comi"
version = "0.2.1"
description = "A minimal mobile viewer for the unofficial Comifuro map"
edition = "2021"
license = "MIT"

[lib]
name = "comi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
